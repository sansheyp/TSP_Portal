{% extends "base.html" %}
{% block topbar %}{% endblock %}
{% block content %}
<div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 32px 0;">
  <div style="text-align: center; margin-bottom: 36px;">
    <div style="width: 72px; height: 72px; background: #1F4E79; border-radius: 20px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(31,78,121,0.3);">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <h1 style="font-size: 26px; font-weight: 800; color: #1a1a2e; letter-spacing: -0.5px;">TSP Kit Portal</h1>
    <p style="font-size: 14px; color: #999; margin-top: 4px;">The School Photographer</p>
  </div>

  <div class="card">
    {% if error %}
    <div style="background: #FDEDEC; color: #C0392B; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; font-weight: 500;">
      ⚠ {{ error }}
    </div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" name="username" placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="font-size: 16px; padding: 16px;">Log in</button>
    </form>
  </div>
  <p style="text-align: center; font-size: 13px; color: #bbb; margin-top: 16px;">Contact your admin if you need access</p>
</div>
{% endblock %}
